[project]
name = "cf-scraper-python"
version = "0.1.0"
description = "Codeforces Problem Scraper & Synchronization Pipeline"
readme = "README.md"
authors = [
    { name = "seudoe", email = "207736949+seudoe@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.6",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.optional-dependencies]
scraper = [
    "beautifulsoup4>=4.15.0",
    "selenium>=4.52.0",
    "undetected-chromedriver>=3.5.5",
]

[tool.uv]
package = false
